name: Check Frontend
on:
  push:
    branches:
      - main
      - feature/web
  pull_request:
    types:
      - reopened
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  check:
    name: Prettier, ESLint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2
      - name: Install dependencies
        run: bun install
      - name: Prettier
        run: bunx prettier --check .
      - name: ESLint
        run: bun run lint
      - name: TypeCheck
        run: bun run typecheck
